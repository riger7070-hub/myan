name = "myan"
main = "worker.js"
compatibility_date = "2024-11-01"

# ⚠️ pages_build_output_dir 를 여기에 넣지 말 것.
# 이건 Workers 프로젝트지 Pages 프로젝트가 아닌데, 그 필드가 있으면 wrangler 가 설정을
# Pages 로 오해해서 (1) `wrangler secret list` / `deployments list` / `d1 execute` 같은
# Workers 전용 명령이 "Pages 프로젝트입니다"라며 거부되고, (2) `wrangler deploy` 가 매번
# "정말 진행할까요?" 확인을 물어 CI 에서는 폴백 응답에 기대어 배포되고 있었다.
# 제거 후 dry-run 결과(바인딩·업로드 크기)는 완전히 동일함을 확인했다.

[assets]
directory = "./"
binding = "SITE_ASSETS"
# 워커를 먼저 실행 → index.html에 보안 헤더(COOP 등)+ENV 주입이 실제로 적용되도록.
# (미설정 시 정적 자산이 워커를 우회해 직접 서빙되어 COOP가 누락됨 → Google 로그인 팝업 차단)
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "myan-db"
database_id = "ef511379-fa0b-45c7-b14e-6ccb842c719f"

# 배포마다 고유한 버전 ID 제공 — 서비스워커 캐시 버전을 여기서 직접 읽어와
# CI의 sed 스크립트(sw.js VERSION 수동 치환) 없이도 배포마다 확실히 갱신되게 함
[version_metadata]
binding = "CF_VERSION_METADATA"

# ── 앱인토스 서버 API 용 mTLS 인증서 ──
# 앱인토스 API 는 mTLS 가 필수라 일반 fetch 로는 호출할 수 없다.
# 이 바인딩의 fetch() 만 클라이언트 인증서를 제시한다.
#
# 등록 완료 (2026-08-10): Toss appsintoss Root CA 발급, 2027-09-04 만료.
#   wrangler mtls-certificate upload --cert <공개인증서> --key <개인키> --name toss-apps-in-toss
#
# ⚠️ 개인키(.key)는 저장소에 두지 말 것. 실제 키는 Cloudflare 가 보관하고
#    여기 적힌 certificate_id 는 그 참조일 뿐이라 공개돼도 안전하다.
# ⚠️ 2027-09-04 이전에 갱신해야 한다. 만료되면 미니앱 로그인·결제가 전부 멈춘다.
#
# 웹 서비스는 이 바인딩을 쓰지 않으므로 영향이 없다.
[[mtls_certificates]]
binding = "TOSS_MTLS"
certificate_id = "6b215ad6-067b-47cb-a6de-f39b56870f2c"

# ── 일일 푸시 알림: 매일 오전 8시 KST = 23:00 UTC ──
[triggers]
# 0 23 UTC = 08:00 KST — 아침 푸시 + 정기결제 재청구
# 0 19 UTC = 04:00 KST — 운세 캐시 예열만. Gemini 분당 한도를 사용자와 나눠 쓰는 처지라
#   예열은 사람이 가장 안 쓰는 시간에 따로 돌린다. 아침 푸시와 같은 시각에 돌리면
#   운세를 보러 들어온 사람이 예열에 밀려 한도에 걸린다.
crons = ["0 23 * * *", "0 19 * * *"]

# ── Cloudflare Workers Rate Limiting (분산 제한 — 전 세계 인스턴스에 적용) ──

# /chat: 이메일당 분당 30회 (AI 호출 제한)
[[unsafe.bindings]]
name = "RL_CHAT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# /api/payment/verify: 이메일당 분당 5회 (결제 검증 제한)
[[unsafe.bindings]]
name = "RL_PAYMENT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# 일반 API: 이메일당 분당 30회 (signup-grant, migrate-tokens, payment-request)
[[unsafe.bindings]]
name = "RL_API"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

# 환경변수 (공개 가능한 값들)
[vars]
GOOGLE_CLIENT_ID = "806789036860-iu94f5ne93t2vh2mvfuqmi3mj95m8ick.apps.googleusercontent.com"
ADMIN_EMAIL = "riger7070@gmail.com"
TOSS_CLIENT_KEY = "test_ck_lpP2YxJ4K877JAdv7KX8RGZwXLOb"

# 비밀 값들은 wrangler secret put 명령어로 설정:
# wrangler secret put GEMINI_API_KEY
# wrangler secret put TOSS_SECRET_KEY
# wrangler secret put ADMIN_SECRET
# wrangler secret put SESSION_SECRET
# wrangler secret put VAPID_PRIVATE_KEY
# wrangler secret put VAPID_PUBLIC_KEY
# wrangler secret put VAPID_EMAIL
# wrangler secret put TELEGRAM_BOT_TOKEN
# wrangler secret put TELEGRAM_CHAT_ID
# wrangler secret put UNGI_PIN
# wrangler secret put CAFE_STAFF_PIN
# wrangler secret put PROMO_ADMIN_PIN
# wrangler secret put MASTER_IP
# wrangler secret put TOSS_UNLINK_AUTH
# wrangler secret put TOSS_DECRYPT_KEY
# wrangler secret put TOSS_DECRYPT_AAD
#
# ⚠️ TOSS_DECRYPT_KEY / TOSS_DECRYPT_AAD 는 앱인토스 콘솔의
# "이메일로 복호화 키 받기" 로 받는 값입니다(키는 base64 그대로 넣습니다).
# 토스 로그인이 주는 이름·생년월일·성별은 AES-256-GCM 암호문이라 이게 있어야 풉니다.
# 미설정 시에는 복호화가 조용히 null 이 되어 사용자가 생년월일을 직접 입력합니다
# (로그인은 정상 동작합니다).
#
# ⚠️ TOSS_UNLINK_AUTH 는 앱인토스 콘솔 "연결 끊기 콜백"에 등록한 Basic Auth 헤더 값
# **전체 문자열**입니다(예: "Basic dG9zcy11bmxpbms6..."). 토스가 탈퇴 통지를 보낼 때
# 이 값으로 본인을 증명하고, 서버는 대조해서 통과시킵니다.
# 설정 전까지 /mini/api/auth/unlink 는 항상 401 입니다 — userKey 만 알면 남의 계정을
# 끊을 수 있는 엔드포인트라 폴백을 두지 않았습니다.
#
# ⚠️ 위 세 PIN 시크릿(UNGI_PIN/CAFE_STAFF_PIN/PROMO_ADMIN_PIN)은 하드코딩 폴백을
# 제거했으므로, 설정 전까지 해당 PIN 인증 경로는 항상 거부됩니다(안전한 기본값).
#
# ⚠️ MASTER_IP 는 게스트 체험(하루 1회)을 제한 없이 쓰는 운영자 IP 입니다. 공개 저장소라
# 코드에서 뺐고 폴백도 없으므로, 설정 전까지는 운영자도 다른 사용자와 똑같이 하루 1회입니다.
