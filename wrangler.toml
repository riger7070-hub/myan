name = "myan"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "myan-db"
database_id = "ef511379-fa0b-45c7-b14e-6ccb842c719f"

# ── 일일 푸시 알림: 매일 오전 8시 KST = 23:00 UTC ──
[triggers]
crons = ["0 23 * * *"]

# ── Cloudflare Workers Rate Limiting (분산 제한 — 전 세계 인스턴스에 적용) ──

# /chat: 이메일당 분당 30회 (AI 호출 제한)
[[unsafe.bindings]]
name = "RL_CHAT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# /api/payment/verify: 이메일당 분당 5회 (결제 검증 제한)
[[unsafe.bindings]]
name = "RL_PAYMENT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# 일반 API: 이메일당 분당 30회 (signup-grant, migrate-tokens, payment-request)
[[unsafe.bindings]]
name = "RL_API"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 30, period = 60 }
