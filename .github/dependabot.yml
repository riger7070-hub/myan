# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 1. 웹 서비스 메인 소스코드의 의존성 라이브러리 보안 업데이트
  - package-ecosystem: "npm" # 프로젝트에 맞게 pip, yarn 등으로 변경 가능
    directory: "/"
    schedule:
      interval: "weekly" # 매주 주기적으로 취약점 및 업데이트 검사
    open-pull-requests-limit: 3 # 너무 많은 PR이 쌓이지 않도록 제한
    assignees:
      - "riger7070-hub" # 발견 시 본인에게 바로 알림/담당자 지정

  # 2. GitHub Actions 워크플로우 자동 업데이트 (보안 배포 파이프라인 보호)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly" # 액션은 한 달에 한 번 정도가 적당합니다.
    assignees:
      - "riger7070-hub"
