<!-- 인앱 상품 이미지 원본 (1024×1024).
     tools/build-store-images.mjs 가 이 파일을 열어 PNG 로 찍어 낸다.
     ?tokens=10 처럼 붙여 개수를 바꾸고, ?kind=alms 면 안스님 동냥 그림이 된다.

     ⚠️ 밤하늘·별·브랜드 글씨는 **한 벌만 둔다.** 상품마다 파일을 따로 만들면
        한쪽 바탕을 고치고 다른 쪽을 잊는다. 콘솔에 나란히 걸리는 그림들이라
        한 벌로 보여야 한다. -->
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0b0906;
    font-family: 'Noto Serif KR', 'Batang', serif;
  }
  /* 밤하늘 — 가운데가 살짝 밝다 */
  .sky {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 42%, rgba(201,169,110,0.16) 0%, rgba(201,169,110,0.05) 38%, transparent 66%),
      linear-gradient(158deg, #1a150e 0%, #120e09 52%, #0a0806 100%);
  }
  .stars { position: absolute; inset: 0; }
  .stars i {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #e8d4a8; opacity: .5;
  }
  .wrap { position: relative; text-align: center; }

  /* 엽전 — 둥근 밖, 네모난 안 */
  .coin { position: relative; width: 560px; height: 560px; margin: 0 auto; }
  .coin svg { width: 100%; height: 100%; display: block; }

  /* 숫자는 엽전 가운데 네모(560px 중 36%) 안에 들어와야 한다.
     넘치면 테두리를 파고들어 엽전이 아니라 얼룩처럼 보인다. */
  .num {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 150px; font-weight: 700; color: #f0e2c2;
    letter-spacing: -0.03em;
    text-shadow: 0 0 44px rgba(201,169,110,0.5);
  }
  .num.small { font-size: 108px; }   /* 세 자리 */

  .label {
    margin-top: 26px;
    font-size: 74px; color: #c9a96e; letter-spacing: 0.16em;
  }
  .brand {
    margin-top: 14px;
    font-size: 38px; color: rgba(201,169,110,0.55); letter-spacing: 0.34em;
  }

  /* 동냥 그림일 때 — 엽전 자리를 안스님이 대신한다.
     ⚠️ 24px 아이콘을 늘려 쓰지 않고 따로 그린다. 작은 아이콘은 획을 줄여 그린
        것이라 크게 키우면 휑하다. 여기서는 얼굴과 엽전을 더 넣을 자리가 있다. */
  .alms .num { display: none; }
</style>
<div class="sky"></div>
<div class="stars" id="stars"></div>
<div class="wrap" id="wrap">
  <div class="coin">
    <svg viewBox="0 0 200 200" fill="none" stroke="#c9a96e" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" id="art">
      <circle cx="100" cy="100" r="94" opacity=".28"/>
      <circle cx="100" cy="100" r="86" opacity=".85"/>
      <circle cx="100" cy="100" r="78" opacity=".3"/>
      <rect x="64" y="64" width="72" height="72" rx="5" opacity=".55"/>
    </svg>
    <div class="num" id="num">10</div>
  </div>
  <div class="label" id="label">엽전</div>
  <div class="brand">M;Y 安</div>
</div>

<!-- 안스님. 앱 아이콘(mini/src/icons.js 의 monk)과 같은 자세지만, 이 크기에서는
     감은 눈과 떨어지는 엽전을 더 넣을 자리가 있다.

     ⚠️ <template> 안에 두면 안 된다. 템플릿 속은 **HTML 이름공간**으로 읽혀서
        circle·path 가 SVG 도형이 아니라 이름 모를 HTML 태그가 된다. 옮겨 붙여도
        아무것도 안 그려진다(실제로 빈 하늘만 나왔다).
        진짜 <svg> 안에 두고 그 자식을 옮긴다. -->
<svg id="alms-src" viewBox="0 0 200 200" style="display:none">
  <circle cx="100" cy="46" r="25" opacity=".9"/>
  <!-- 감은 눈. 가로선 둘이면 눈을 내리깐 얼굴이 된다.
       ⚠️ 사이를 넉넉히 띄운다. 처음에 6만 띄웠더니 멀리서 한 줄로 붙어 보였다. -->
  <path d="M84 46h12M104 46h12" opacity=".8"/>
  <path d="M52 150c0-37 21.5-63 48-63s48 26 48 63H52Z" opacity=".85"/>
  <!-- ⚠️ 여기에 곡선을 그으면 웃는 입으로 보인다. 처음에 가사 자락이라고 호를
       그렸다가 몸통에 입이 달린 꼴이 됐다. 여밈은 V 로 짧게. -->
  <path d="M88 93 100 105 112 93" opacity=".4"/>
  <path d="M62 166h76a38 38 0 0 1-76 0Z" opacity=".9"/>
  <!-- 엽전 셋이 바리때로 떨어진다. 옆에 나란히 두면 떠 있는 것처럼 보이므로
       오른쪽 위에서 바리때 전으로 내려오는 선을 따라 놓는다.
       구멍은 셋 다 낸다 — 하나만 빠지면 그것만 다른 물건으로 보인다. -->
  <g opacity=".5">
    <circle cx="158" cy="92" r="9"/><rect x="154.5" y="88.5" width="7" height="7" rx="1"/>
    <circle cx="152" cy="126" r="7.5"/><rect x="149" y="123" width="6" height="6" rx="1"/>
    <circle cx="141" cy="157" r="6"/><rect x="138.5" y="154.5" width="5" height="5" rx="1"/>
  </g>
</svg>
<script>
  const p = new URLSearchParams(location.search);

  if (p.get('kind') === 'alms') {
    // 엽전 그림을 통째로 안스님으로 바꾼다. 바탕·별·브랜드는 그대로 쓴다.
    document.getElementById('wrap').classList.add('alms');
    const art = document.getElementById('art');
    // 이미 SVG 이름공간으로 만들어진 도형들을 그대로 옮긴다.
    art.replaceChildren(...document.getElementById('alms-src').children);
    document.getElementById('label').textContent = '동냥';
  } else {
    const n = p.get('tokens') || '10';
    const el = document.getElementById('num');
    el.textContent = n;
    if (n.length >= 3) el.classList.add('small');
  }

  // 별은 매번 같은 자리에 찍혀야 한다 — 이미지를 다시 뽑을 때마다 달라지면
  // 무엇이 바뀐 건지 알 수 없다. 그래서 난수 대신 고정된 식을 쓴다.
  let seed = 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const host = document.getElementById('stars');
  for (let i = 0; i < 46; i++) {
    const s = document.createElement('i');
    s.style.left = (rnd() * 100).toFixed(2) + '%';
    s.style.top = (rnd() * 100).toFixed(2) + '%';
    s.style.opacity = (0.16 + rnd() * 0.5).toFixed(2);
    const sz = (2 + rnd() * 3).toFixed(1);
    s.style.width = s.style.height = sz + 'px';
    host.appendChild(s);
  }
</script>
