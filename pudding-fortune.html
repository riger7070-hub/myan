// ════════════════════════════════
//  언어 감지 + 전환
// ════════════════════════════════
function detectLang() {
  const saved = localStorage.getItem('pudding_lang');
  if (saved && UI[saved]) return saved;
  const nav = (navigator.language || 'ko').toLowerCase();
  if (nav.startsWith('en')) return 'en';
  if (nav.startsWith('zh')) return 'zh';
  if (nav.startsWith('ja')) return 'ja';
  return 'ko';
}

let plang = detectLang();
let lastState = null; // 마지막 화면 상태 (언어 전환 시 재렌더용)

function t() { return UI[plang] || UI.ko; }

function setPLang(l) {
  if (!UI[l]) return;
  plang = l;
  localStorage.setItem('pudding_lang', l);
  syncLangUI();
  rerender();
}

function syncLangUI() {
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('on', btn.dataset.lang === plang);
  });
  document.getElementById('brand-sub').textContent = t().brandSub;
  const loadingEl = document.getElementById('loading-text');
  if (loadingEl) loadingEl.textContent = t().loading;
  document.documentElement.lang = plang === 'zh' ? 'zh-CN' : plang;
}

function rerender() {
  if (!lastState) return;
  if (lastState.type === 'fortune') displayFortune(lastState.seed, lastState.revisit);
  else if (lastState.type === 'locked') showLocked();
  else if (lastState.type === 'error') showCodeError(lastState.status);
  else if (lastState.type === 'generic') showGenericError();
}

// ════════════════════════════════
//  화면 렌더링
// ════════════════════════════════
// 시드 → 메시지 매핑 (서버가 코드당 1개 시드를 확정하므로 재방문·언어 전환 시 같은 메시지)
function getFortuneBySeed(seed) {
  const all = [];
  FORTUNES.forEach(cat => cat.messages.forEach(msg => all.push({ category: cat.category, message: msg })));
  return all[seed % all.length];
}

    <div class="cta-section">
      <div class="cta-title">${t().lockedCta}</div>
      <a href="/" class="cta-btn">${t().ctaBtn}</a>
    </div>
  `;
}

function showCodeError(status) {
  lastState = { type: 'error', status };
  let title, sub;
  if (status === 410) { title = t().usedTitle; sub = t().usedSub; }
  else if (status === 429) { title = t().busyTitle; sub = t().busySub; }
  else { title = t().invalidTitle; sub = t().invalidSub; }

  document.getElementById('content').innerHTML = `
    <div class="error">
      <div style="font-size:2rem;margin-bottom:8px">🍮</div>
      <div>${title}</div>
      <div style="margin-top:8px;font-size:0.85rem;opacity:0.8">${sub}</div>
    </div>
    <div class="cta-section">
      <div class="cta-title">${t().ctaTitle}</div>
      <a href="/" class="cta-btn">${t().ctaBtn}</a>
    </div>
  `;
}

function showGenericError() {
  lastState = { type: 'generic' };
  document.getElementById('content').innerHTML = `
    <div class="error">${t().errGeneric}</div>
  `;
}

function displayFortune(seed, isRevisit) {
  lastState = { type: 'fortune', seed, revisit: isRevisit };
  const fortune = getFortuneBySeed(seed);

  document.getElementById('content').innerHTML = `
    <div class="fortune-card">
      <div class="fortune-label">${isRevisit ? t().labelRevisit : t().label}</div>
      <div class="fortune-text">${fortune.message[plang] || fortune.message.ko}</div>
      <div class="fortune-category">${fortune.category[plang] || fortune.category.ko}</div>
    </div>

    <div class="cta-section">
      <div class="cta-title">${t().ctaTitle}</div>
      <a href="/" class="cta-btn">${t().ctaBtn}</a>
    </div>

    <div class="footer-note">
      ${isRevisit ? t().footerRevisit : t().footerNew}<br>
      ${t().footer2}
    </div>
  `;
}

// ════════════════════════════════
//  일회용 코드 검증
// ════════════════════════════════
async function showFortune() {
  const code = new URLSearchParams(location.search).get('c');

  if (!code) {
    showLocked();
    return;
  }

  try {
    const res = await fetch('/api/fortune-qr/redeem', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await res.json().catch(() => ({}));

    if (!res.ok || !data.success) {
      showCodeError(res.status);
      return;
    }

    displayFortune(data.seed, !!data.revisit);
  } catch (error) {
    showGenericError();
  }
}

// 페이지 로드 시 실행
syncLangUI();
window.addEventListener('load', () => {
  setTimeout(showFortune, 800);
});
</script>
