<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 800" role="img" aria-label="안할매">
<title>안할매</title>
<!-- ⚠️ 안도령(andoryeong.svg)과 몸·팔·다리 좌표가 같다. 형제로 보이려면 건드리지 않는다.
     맡은 자리: 삼재·신살·액막이. 노리개 대신 부적을 걸었다.

     ⚠️ 나이는 흰머리만으로 나지 않는다. 처음엔 안도령의 눈·볼·입을 그대로 두고
        머리만 희게 칠했더니 "흰머리 쓴 젊은이"가 됐다. 나이를 내는 것은 이 넷이다.
          · 눈  — 반달로 웃기지 않는다. 가는 실눈에 바깥이 처진 눈꺼풀을 얹는다
          · 눈썹 — 넷 중 이 캐릭터만 눈썹이 있다. 희고 두껍고 바깥이 처진다
          · 볼  — 볼터치는 어림의 표시다. 옅게(0.4) 줄인다
          · 배자 — 어깨에 두른 짙은 덧옷. 무게는 얼굴이 아니라 옷이 잡아 준다
     ⚠️ 주름은 눈가에만 둘씩 둔다. 프로필 사진 크기(150px)로 줄면 선 하나가
        1px 미만이 되어, 더 넣으면 얼굴이 지저분해지기만 한다. -->
<rect x="495" y="370" width="50" height="190" rx="25" fill="#f6ead0" stroke="#2b1d10" stroke-width="10" transform="rotate(12 520 380)"/>
<rect x="135" y="370" width="50" height="190" rx="25" fill="#f6ead0" stroke="#2b1d10" stroke-width="10" transform="rotate(-12 160 380)"/>
<rect x="345" y="620" width="90" height="110" rx="45" fill="#f6ead0" stroke="#2b1d10" stroke-width="10"/>
<rect x="245" y="620" width="90" height="110" rx="45" fill="#f6ead0" stroke="#2b1d10" stroke-width="10"/>
<rect x="170" y="200" width="340" height="480" rx="140" fill="#f6ead0" stroke="#2b1d10" stroke-width="10"/>
<!-- 어깨에 두른 배자. 바깥 선은 몸통 벽(x=170)과 아래 모서리 호(중심 310,540 / 반지름 140)
     안쪽을 따라간다 — 밖으로 나가면 옷이 아니라 얼룩으로 보인다.
     ⚠️ 윗선은 눕힌다. 가로로 곧게 그었더니 허공에서 시작해 붙인 조각처럼 보였다. -->
<path d="M 176 404 L 176 540 Q 180 590 208 620 L 262 578 Q 246 490 232 436 Z"
      fill="#47596b" stroke="#2b1d10" stroke-width="9" stroke-linejoin="round"/>
<path d="M 504 404 L 504 540 Q 500 590 472 620 L 418 578 Q 434 490 448 436 Z"
      fill="#47596b" stroke="#2b1d10" stroke-width="9" stroke-linejoin="round"/>
<line x1="245" y1="452" x2="340" y2="505" stroke="#55677a" stroke-width="11" stroke-linecap="round"/>
<line x1="435" y1="452" x2="340" y2="505" stroke="#55677a" stroke-width="11" stroke-linecap="round"/>
<!-- 목에 건 부적 -->
<line x1="340" y1="516" x2="340" y2="548" stroke="#c9a96e" stroke-width="8" stroke-linecap="round"/>
<rect x="306" y="546" width="68" height="96" rx="9" fill="#f2d98c" stroke="#2b1d10" stroke-width="8"/>
<line x1="326" y1="570" x2="326" y2="620" stroke="#b8354a" stroke-width="7" stroke-linecap="round"/>
<line x1="354" y1="570" x2="354" y2="620" stroke="#b8354a" stroke-width="7" stroke-linecap="round"/>
<line x1="316" y1="588" x2="364" y2="588" stroke="#b8354a" stroke-width="7" stroke-linecap="round"/>
<ellipse cx="245" cy="404" rx="26" ry="18" fill="#f0b06a" opacity="0.4"/>
<ellipse cx="435" cy="404" rx="26" ry="18" fill="#f0b06a" opacity="0.4"/>
<!-- 지그시 뜬 실눈 -->
<ellipse cx="280" cy="350" rx="27" ry="9" fill="#2b1d10"/>
<ellipse cx="400" cy="350" rx="27" ry="9" fill="#2b1d10"/>
<path d="M 250 340 Q 280 320 310 330" fill="none" stroke="#2b1d10" stroke-width="9" stroke-linecap="round"/>
<path d="M 430 340 Q 400 320 370 330" fill="none" stroke="#2b1d10" stroke-width="9" stroke-linecap="round"/>
<!-- 눈가 주름 -->
<line x1="244" y1="336" x2="228" y2="328" stroke="#2b1d10" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
<line x1="243" y1="352" x2="226" y2="354" stroke="#2b1d10" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
<line x1="436" y1="336" x2="452" y2="328" stroke="#2b1d10" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
<line x1="437" y1="352" x2="454" y2="354" stroke="#2b1d10" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
<!-- 흰 눈썹. 바깥쪽이 처진다.
     ⚠️ 머리와 같은 흰색(#e6e1d6)으로 칠했더니 흰 앞머리에 묻혀 안 보였다. 한 톤 어둡게 쓴다. -->
<path d="M 236 308 Q 272 288 312 298" fill="none" stroke="#cfc7b6" stroke-width="12" stroke-linecap="round"/>
<path d="M 444 308 Q 408 288 368 298" fill="none" stroke="#cfc7b6" stroke-width="12" stroke-linecap="round"/>
<path d="M 310 408 Q 340 424 370 408" fill="none" stroke="#2b1d10" stroke-width="10" stroke-linecap="round"/>
<!-- 흰 앞머리. 이마를 넓게 드러내려고 이마 선을 위로 올렸다. -->
<path d="M 174 328 Q 176 204 340 201 Q 504 204 506 328 Q 428 252 340 258 Q 252 252 174 328 Z"
      fill="#e6e1d6" stroke="#2b1d10" stroke-width="10" stroke-linejoin="round"/>
<!-- 쪽진 머리와 비녀. 숱이 적어 보이도록 낮고 작게 얹는다. -->
<ellipse cx="340" cy="160" rx="62" ry="46" fill="#e6e1d6" stroke="#2b1d10" stroke-width="9"/>
<line x1="276" y1="160" x2="404" y2="160" stroke="#c9a96e" stroke-width="12" stroke-linecap="round"/>
<circle cx="272" cy="160" r="14" fill="#c9a96e" stroke="#2b1d10" stroke-width="7"/>
</svg>
